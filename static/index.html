<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Monitor</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡️</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🌡️</span>
      <div>
        <h1>System Monitor</h1>
        <p id="subtitle">connecting…</p>
      </div>
    </div>
    <div class="controls">
      <span id="status" class="status status--connecting" title="Connection status">
        <span class="dot"></span><span class="status-text">connecting</span>
      </span>
      <label class="ctl">Refresh
        <select id="interval">
          <option value="1000">1s</option>
          <option value="2000">2s</option>
          <option value="3000">3s</option>
          <option value="5000">5s</option>
        </select>
      </label>
      <button id="pause" class="btn" title="Pause / resume updates">⏸ Pause</button>
      <button id="reset-layout" class="btn" title="Reset cards to default order">⤺ Layout</button>
    </div>
  </header>

  <main id="grid" class="grid">
    <div class="placeholder">Loading sensors…</div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="/static/app.js"></script>
</body>
</html>
